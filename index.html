<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
    <header>
    <h1>Task Board</h1>
    <div class="header-actions">
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
      <button id="add-task-button">Add Task</button>
    </div>
  </header>
  <p id="status-message" class="status-message"></p>
    <main class="board">
    <section class="column" data-status="todo">
      <h2>To Do <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
    <section class="column" data-status="in_progress">
      <h2>In Progress <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
    <section class="column" data-status="in_review">
      <h2>In Review <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
    <section class="column" data-status="done">
      <h2>Done <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
  </main>
  <dialog id="task-dialog">
    <form id="task-form">
      <label for="task-title">Title</label>
      <input type="text" id="task-title" name="title" required>
      <label for="task-description">Description</label>
      <textarea id="task-description" name="description"></textarea>
      <label for="task-priority">Priority</label>
      <select id="task-priority">
        <option value="low">Low</option>
        <option value="normal" selected>Normal</option>
        <option value="high">High</option>
      </select>
      <label for="task-due-date">Due Date</label>
      <input type="date" id="task-due-date">
      <p id="form-error" class="form-error"></p>
      <button type="submit">Add Task</button>
      <button type="button" id="cancel-button">Cancel</button>
    </form>
  </dialog>
</body>
</html>
